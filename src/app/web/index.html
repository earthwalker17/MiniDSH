<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <title>MiniDSH</title>
    <!-- MiniDSH's mark, as a data: URL (the CSP allows data: images and no other origin). -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='1' y='1' width='22' height='22' rx='7' fill='%230f1115'/%3E%3Cpath d='M6.5 16.5V9.5a2.5 2.5 0 0 1 5 0v7M11.5 9.5a2.5 2.5 0 0 1 5 0v7' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='17.75' cy='6.25' r='1.6' fill='%233cc2b0'/%3E%3C/svg%3E"
    />
    <!-- Before the stylesheet and synchronous: the theme is set before first paint. -->
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="app" id="app">
      <aside class="sidebar" id="sidebar" aria-label="Sessions">
        <div class="brand" id="brand"></div>
        <button class="new-session" id="new" type="button"></button>
        <div class="list-head" id="list-head"></div>
        <input class="filter" id="filter" type="search" placeholder="Filter sessions" aria-label="Filter sessions" hidden />
        <nav class="session-list" id="sessions" aria-label="Session list"></nav>
        <div class="sidebar-foot" id="sidebar-foot"></div>
      </aside>
      <div class="scrim" id="scrim" hidden></div>

      <main class="main" id="main" data-empty="">
        <header class="topbar" id="topbar"></header>
        <div class="strip damaged" id="damaged" role="status" hidden>
          The stored log is damaged: what follows is its readable prefix, not the whole session.
        </div>
        <!--
          `role=log` with live announcements OFF: a streaming answer would be
          read out token by token. Status changes go to the announcer below.
        -->
        <div class="scroller" id="log" role="log" aria-live="off" aria-label="Conversation">
          <div class="column">
            <section class="hero" id="hero" aria-label="New session"></section>
            <button class="load-earlier" id="more" type="button" hidden>Load earlier</button>
            <div class="history-start" id="history-start" hidden>Start of the conversation</div>
            <div class="transcript" id="rows"></div>
            <div id="live"></div>
            <div class="working" id="working" hidden></div>
          </div>
        </div>
        <button class="to-bottom" id="to-bottom" type="button" aria-label="Back to bottom" title="Back to bottom" hidden></button>
        <div class="dock" id="dock">
          <div class="dock-inner">
            <div class="workspace-chip-row" id="workspace-row" hidden></div>
            <section class="approval" id="approval" aria-labelledby="approval-head" hidden></section>
            <div class="readonly-bar" id="readonly" hidden></div>
            <form class="composer" id="composer" autocomplete="off">
              <label class="sr-only" for="prompt">Message</label>
              <textarea id="prompt" rows="1" placeholder="Ask MiniDSH to work on something…"></textarea>
              <div class="composer-bar" id="composer-bar"></div>
            </form>
            <div class="composer-meta" id="composer-meta"></div>
          </div>
        </div>
        <aside class="panel" id="panel" aria-label="Session details" hidden></aside>
      </main>
    </div>

    <dialog class="modal" id="settings" aria-label="Settings"></dialog>
    <div class="toasts" id="toasts"></div>
    <div class="sr-only" id="announcer" role="status" aria-live="polite"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
