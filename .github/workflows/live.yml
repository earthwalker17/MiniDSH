# The eight live arcs against the real providers.
#
# `workflow_dispatch` only, deliberately. These spend a real account, so no
# push starts them and a fork's pull request cannot reach the secrets at all —
# which is the same protection stated twice, and neither is a substitute for
# the other. A person decides when this runs.
#
# It runs on the two hosts that can confine a shell — Linux with bubblewrap,
# macOS with Seatbelt — because that is where the confined branch of the
# authority arc and a real model meet, and there is no Mac anywhere else in
# this project: the macOS leg is the only evidence that branch has on that OS.
# Both legs report (`fail-fast: false`); neither stands in for the other.
name: live

on:
  workflow_dispatch:
    inputs:
      filter:
        description: 'vitest filename filter (blank runs all eight arcs)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  arcs:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      # Each arc self-skips without a key, so an unset secret would produce a
      # green run that proved nothing — the same failure mode the confinement
      # legs guard against, and it gets the same answer.
      - name: Refuse to pass having run nothing
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "DEEPSEEK_API_KEY is unset: every arc would self-skip and this job would be a green lie."
            exit 1
          fi
          # The routing arc needs both, and self-skips on either — so checking
          # only the first would let seven arcs stand in for eight.
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY is unset: the routing arc would self-skip and this job would report eight arcs having run seven."
            exit 1
          fi

      - name: Install bubblewrap so the arcs run against a CONFINED host
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || echo "apparmor userns knob absent; the probe decides"
          bwrap --ro-bind / / --dev /dev --unshare-pid --proc /proc --die-with-parent -- true \
            && echo "bwrap: functional — the arcs take their confined branch" \
            || echo "bwrap: not functional — the arcs take their unconfined branch"

      # The same functional probe check.yml makes: the arcs branch on what the
      # host REPORTS, and this line says up front which branch to expect.
      - name: Report whether sandbox-exec can actually confine
        if: runner.os == 'macOS'
        run: |
          sandbox-exec -p '(version 1)(allow default)(deny file-write*)' -- true \
            && echo "sandbox-exec: functional — the arcs take their confined branch" \
            || echo "sandbox-exec: not functional — the arcs take their unconfined branch"

      # No `require-lockfile`: the first real run of check.yml warned that the
      # v2 action has no such input, and pnpm installs frozen under CI anyway.
      - uses: pnpm/setup@v2
        with:
          runtime: node@24.19.0
          cache: true

      # FILTER goes through the environment, never interpolated into the script:
      # `${{ inputs.filter }}` is expanded before bash parses the line, so a
      # dispatch could otherwise append a second command to a step holding both
      # API keys. Unquoted on use so a blank filter expands to nothing.
      - run: pnpm test:e2e $FILTER
        env:
          FILTER: ${{ inputs.filter }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # The arcs above run the CHECKOUT's TypeScript source. `check.yml` proves
      # the installed package STARTS; nothing proved it works, and "works" is
      # the whole claim a release makes. So: pack, install into an empty
      # directory outside the checkout, and drive one real task through the
      # installed bin against the same model — the artifact a stranger gets,
      # doing the thing they got it for.
      - name: Do real work through the INSTALLED package, not the checkout
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          pnpm pack --pack-destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          mkdir -p installed/proj installed/ws installed/home && cd installed/proj
          npm init -y > /dev/null
          npm install --no-audit --no-fund ../../minidsh-*.tgz
          cat > ../ws/slug.mjs <<'JS'
          export function slugify(input) {
            return input.replace(/ /g, '-')
          }
          JS
          cat > ../ws/slug.test.mjs <<'JS'
          import { test } from 'node:test'
          import assert from 'node:assert'
          import { slugify } from './slug.mjs'
          test('slugify lowercases and hyphenates', () => {
            assert.strictEqual(slugify('Hello World'), 'hello-world')
          })
          JS
          # It must fail first, or what follows proves nothing.
          if (cd ../ws && node --test slug.test.mjs > /dev/null 2>&1); then
            echo "the fixture test passed before the agent ran: this step would prove nothing"; exit 1
          fi
          MINIDSH_HOME=../home node node_modules/minidsh/bin/minidsh.js run "slug.test.mjs fails against slug.mjs. Read both with the editor tool, fix slug.mjs so the test passes, and say what you changed. Use relative paths." --cwd ../ws --approve --max-steps 12
          # The WORLD, not the agent's account of it.
          cd ../ws && node --test slug.test.mjs
