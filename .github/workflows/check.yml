# The repository gate, on the three platforms MiniDSH claims to run on.
#
# `pnpm check` is typecheck + lint + the dependency gate + the unit suite. The
# live arcs are NOT here: they cost real provider calls and live in `live.yml`,
# which only a person can start.
#
# The Linux and macOS legs additionally exist to prove OS confinement, so they
# set MINIDSH_EXPECT_CONFINEMENT=1, which turns a self-skipped confinement test
# into a failure. A leg that exists to prove something may not pass having
# proved nothing — and a skip and a pass look identical in a summary.
name: check

on:
  push:
    # Release branches too, by PATTERN rather than by name: the gate that exists
    # to stop a leg passing having proved nothing is itself only proved by
    # running, and a branch it never runs on is a branch where a change to this
    # file goes unexercised — which is how the shell gate reached a release
    # candidate unrun. A dead branch name here would be the same drift again.
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # Every platform reports: one red leg must not hide the other two.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # ubuntu-latest is Ubuntu 24.04, which gates unprivileged user namespaces
      # behind an AppArmor knob; bubblewrap needs them and is not preinstalled.
      # The sysctl is best-effort because the FUNCTIONAL probe is what decides —
      # the same reason nothing here checks for the binary's existence.
      - name: Install bubblewrap and report whether it can actually confine
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || echo "apparmor userns knob absent; the probe decides"
          if bwrap --ro-bind / / --dev /dev --unshare-pid --proc /proc --die-with-parent -- true; then
            echo "bwrap: functional"
          else
            echo "bwrap: PRESENT BUT NOT FUNCTIONAL — the confinement tests below will fail, and that is the honest outcome"
          fi

      - name: Report whether sandbox-exec can actually confine
        if: runner.os == 'macOS'
        run: |
          if sandbox-exec -p '(version 1)(allow default)(deny file-write*)' -- true; then
            echo "sandbox-exec: functional"
          else
            echo "sandbox-exec: PRESENT BUT NOT FUNCTIONAL — the confinement tests below will fail, and that is the honest outcome"
          fi

      # Installs pnpm from `packageManager` and the runtime itself, so there is
      # no second setup step to drift out of step with it. No `require-lockfile`:
      # the first real run warned that the v2 action has no such input, and pnpm
      # installs frozen under CI anyway (the run said "Lockfile is up to date").
      - uses: pnpm/setup@v2
        with:
          runtime: node@24.19.0
          cache: true

      - run: pnpm check
        env:
          # Windows ships no backend and is not asked to prove one (§13).
          MINIDSH_EXPECT_CONFINEMENT: ${{ (runner.os == 'Linux' || runner.os == 'macOS') && '1' || '' }}
          # Every platform IS asked to prove its shell. The shell suites all
          # self-skip without their dialect's binary, so a runner image that
          # dropped `pwsh` would turn 13 Windows tests green by not running
          # them — the same "green having proved nothing" the line above
          # refuses, and it gets the same answer.
          MINIDSH_EXPECT_SHELL: '1'

      # The install path, on every platform: pack the tarball `prepack` builds,
      # install it into an empty directory OUTSIDE the checkout, and start the
      # installed bin — which must pick `dist/`, since `src/` is not in the
      # tarball and Node would refuse to strip its types under node_modules
      # anyway. Keyless, so this proves the package installs and starts; the
      # arcs in live.yml are what prove it works.
      - name: Pack, install into an empty directory, and start the installed bin
        shell: bash
        run: |
          set -euo pipefail
          pnpm pack --pack-destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          mkdir -p install && cd install
          npm init -y > /dev/null
          npm install --no-audit --no-fund ../minidsh-*.tgz
          test ! -e node_modules/minidsh/src
          test -f node_modules/minidsh/dist/app/cli.js
          test -f node_modules/minidsh/dist/app/web/index.html
          node node_modules/minidsh/bin/minidsh.js --version | grep -q '^minidsh '
          # Each command must ASSERT something, not merely exit 0: `config`
          # proves the whole plugin graph assembled, and the listing proves it
          # answered the empty case rather than failing silently into no output.
          MINIDSH_HOME=../home node node_modules/minidsh/bin/minidsh.js config | grep -q 'core-agent-loop'
          MINIDSH_HOME=../home node node_modules/minidsh/bin/minidsh.js sessions list 2>&1 | grep -q 'no stored sessions'
