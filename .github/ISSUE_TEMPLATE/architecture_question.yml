name: Architecture question or proposal
description: A capability that has no row in ARCHITECTURE §11, or a boundary you think is wrong
labels: [architecture]
body:
  - type: markdown
    attributes:
      value: |
        MiniDSH is architecture-first: a capability has a home before it has code. If you want to add something and [`docs/ARCHITECTURE.md` §11](https://github.com/earthwalker17/MiniDSH/blob/main/docs/ARCHITECTURE.md#11-where-new-things-go) already says where it goes, you can skip this and open a pull request. If it does not, or you think an existing boundary is wrong, this is the place — and the discussion is the contribution, whether or not code follows.
  - type: textarea
    id: capability
    attributes:
      label: The capability or the boundary
      description: What it is, in a sentence or two. If it exists in DeepSeek Harness or another harness, a link to how it is done there helps.
    validations:
      required: true
  - type: textarea
    id: home
    attributes:
      label: Where it would live
      description: Layer (`kernel`, `core`, `capabilities`, `app`), the owning subsystem, and the seam it would implement — a service definition, an event kind, a tool, a plugin row, a protocol method. Say which §11 rows you considered and why none fits.
    validations:
      required: true
  - type: textarea
    id: state
    attributes:
      label: State and dependencies
      description: What state it owns, what state it must not own, what it may depend on, and what may depend on it. If it needs durable state, which new log-only event kind and fold.
  - type: textarea
    id: scope
    attributes:
      label: Relation to what is deliberately not built
      description: |
        [`docs/BLUEPRINT.md` §2](https://github.com/earthwalker17/MiniDSH/blob/main/docs/BLUEPRINT.md#2-macro-route-dependency-ordered-sessions-are-approximate) lists what V1 leaves out and why, and §3 the open questions. If this touches one of them, say which and what has changed.
